name: Feature request
description: Suggest a focused improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case and current limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include platform differences or alternatives if relevant.
