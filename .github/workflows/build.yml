name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy rust-docs
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config ffmpeg
      - name: Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/setup-ffmpeg.ps1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Licenses and source integrity
        run: python scripts/test-licenses.py
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Decode, seek, loop and cache integration
        run: cargo test --locked real_decode_seek_loop_and_cache -- --ignored
      - name: GPU fallback integration
        run: cargo test --locked unavailable_gpu_falls_back_unless_strict -- --ignored
      - name: Wallpaper frame transport
        run: cargo test --locked bmp_stream_decodes_with_ffmpeg -- --ignored
      - name: Release build
        run: cargo build --release --locked
      - name: Configuration CLI
        run: python scripts/test-config.py
      - name: Media import
        run: python scripts/test-import.py
      - name: Settings and cache
        run: python scripts/test-settings.py
      - name: Decoder diagnostics
        run: python scripts/test-doctor.py
      - name: Linux launcher and terminal menu
        if: runner.os == 'Linux'
        run: |
          bash -n start.sh build.sh install.sh scripts/test-linux-gpu.sh
          python3 scripts/test-menu.py
          python3 scripts/test-settings-terminal.py
      - name: Linux playback and visualizers
        if: runner.os == 'Linux'
        env:
          ALSA_CONFIG_PATH: ${{ github.workspace }}/tests/alsa-null.conf
        run: |
          cargo test --locked real_audio_pause_seek_end_and_restart -- --ignored
          python3 scripts/test-playback.py
      - name: Per-user installer
        run: python scripts/test-install.py
      - name: Package
        run: python scripts/package.py
      - name: Debian package
        if: runner.os == 'Linux'
        run: |
          python3 scripts/package-deb.py
          sudo apt-get install -y ./dist/*.deb
          env -u XDG_DATA_HOME asiji --no-config --print-config
          asiji --no-config --doctor
          printf 'q\n' | env -u XDG_DATA_HOME asiji --no-config
          test -d "$HOME/.local/share/asiji/media"
          asiji --no-config --clear-cache
          sudo apt-get remove -y asiji
          test -d "$HOME/.local/share/asiji/media"
      - uses: actions/upload-artifact@v4
        with:
          name: asiji-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          if-no-files-found: error

  linux-desktops:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asiji-Linux
          path: desktop-package
      - name: Extract player
        run: |
          mkdir -p desktop-release target/release
          tar -xf desktop-package/*.tar.gz -C desktop-release --strip-components=1
          cp desktop-release/bin/asiji target/release/asiji
      - name: Desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11 openbox plasma-workspace qdbus-qt5 qml-module-qtquick2 qml-module-qtquick-window2 python3-pil ffmpeg x11-utils xdotool gnome-shell sway grim libmpv-dev meson ninja-build libwayland-dev wayland-protocols libegl1-mesa-dev libx11-dev libxext-dev libxrender-dev
          git clone https://github.com/GhostNaN/mpvpaper.git /tmp/asiji-mpvpaper
          git -C /tmp/asiji-mpvpaper checkout fc5ed285d657c31fbd063b854884ea00e72d2d51
          meson setup /tmp/asiji-mpvpaper/build /tmp/asiji-mpvpaper
          ninja -C /tmp/asiji-mpvpaper/build
          sudo ninja -C /tmp/asiji-mpvpaper/build install
          git clone https://github.com/mmhobi7/xwinwrap.git /tmp/asiji-xwinwrap
          git -C /tmp/asiji-xwinwrap checkout 391519d3bb53e981218de41a37d1f0f95aef3d17
          make -C /tmp/asiji-xwinwrap
          sudo install /tmp/asiji-xwinwrap/xwinwrap /usr/local/bin/xwinwrap
      - name: Plasma, GNOME, X11 and layer-shell sessions
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QUICK_BACKEND: software
        run: |
          for desktop in plasma gnome x11 mpvpaper; do
            xvfb-run -a -s '-screen 0 1280x720x24' dbus-run-session -- python3 scripts/test-linux-wallpaper.py "$desktop"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-evidence
          path: desktop-evidence/

  plasma6:
    needs: build
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20
    steps:
      - name: Dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git xvfb xauth dbus-x11 openbox plasma-workspace qdbus-qt6 python3 python3-pil ffmpeg libasound2t64 x11-utils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: asiji-Linux
          path: desktop-package
      - name: Plasma 6 desktop
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p desktop-release target/release
          tar -xf desktop-package/*.tar.gz -C desktop-release --strip-components=1
          cp desktop-release/bin/asiji target/release/asiji
          xvfb-run -a -s '-screen 0 1280x720x24' dbus-run-session -- python3 scripts/test-linux-wallpaper.py plasma
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plasma6-test-evidence
          path: desktop-evidence/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-desktops, plasma6]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: asiji-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "ASIJI $TAG" --notes-file .github/RELEASE.md
