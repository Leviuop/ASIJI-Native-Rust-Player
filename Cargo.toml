[package]
name = "asiji"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "ASCII and half-block music video player for the terminal"
repository = "https://github.com/Leviuop/ASIJI-Native-Rust-Player"
license = "MIT"

[dependencies]
anyhow = "1"
fs2 = "0.4"
hound = "3.5"
rustfft = "6"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "wav"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
