# ASIJI — user settings. Command-line options override these values.
# Copy with: asiji --init-config
# Inspect active settings with: asiji --print-config

volume = 10          # 0..100 percent
cache_max_mb = 1024  # Oldest cached audio removed first; 0 = no retained cache
cache_max_days = 30  # Age since last use
# cache_dir = "/home/you/.cache/asiji"
import_mode = "copy" # "copy" or "move" (remove original after successful copy)
import_conflict = "skip" # "skip" or "rename"; existing files are never overwritten
muted = false
wallpaper = false   # Live desktop wallpaper; optional Linux desktop integration
wallpaper_backend = "auto" # auto / plasma / mpvpaper / x11 / gnome; Windows uses auto
repeat = false
fps = 30             # 10..60; also capped by the source video
width = 0            # 0 = fit terminal, otherwise 40..1000 columns
mode = "ascii"       # "ascii" or "blocks" (HD half-blocks)
visualizer = "bars"  # Audio without video: "bars", "wave", "orbit"
visual_theme = "aurora" # "aurora", "ember", "ice"
visual_gain = 100    # Sensitivity, 10..400 percent; independent of playback volume
visual_smoothing = 80 # Spectrum release, 0..99; higher = slower decay
visual_bands = 48    # Spectrum bands, 8..128
color = true
hwaccel = "auto"     # "auto", "cpu", "cuda", "d3d11va" (Windows), "vaapi" (Linux)
hwaccel_fallback = true # Retry on CPU if GPU decoding fails
# Optional GPU selection; omit for the driver's default device.
# With an explicit device, select its matching hwaccel backend too.
# hwaccel_device = "/dev/dri/renderD128" # VAAPI: AMD/Intel on Linux
# hwaccel_device = "0"                  # CUDA / D3D11VA: adapter index

# Omit media to use the media folder beside the player.
# Relative paths are relative to this config file, not the working directory.
# Use forward slashes on Windows: media = "D:/Music"
# media = "/home/you/Music"

# Playback shortcuts. An entry replaces all defaults for that action.
# [] disables an action. Ctrl+C always exits, even when quit is empty.
# Named keys: space, enter, esc, tab, backspace, arrows, home, end,
# pageup, pagedown, insert, delete, f1..f12. Modifiers: ctrl+, alt+, shift+.
# Terminal/desktop shortcuts may intercept some combinations.
[bindings]
pause = ["space"]
seek_backward = ["left", "a"]
seek_forward = ["right", "d"]
volume_up = ["up", "+", "="]
volume_down = ["down", "-"]
mute = ["m"]
color = ["c"]
repeat = ["r"]
mode = ["h"]
next = ["n"]
previous = ["p"]
menu = ["q", "esc"]
quit = ["x", "ctrl+c"]
